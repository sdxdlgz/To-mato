# wrangler.toml (最终的、最简化的正确版本)

name = "to-study"
pages_build_output_dir = "public"

compatibility_date = "2024-05-02"
compatibility_flags = [ "nodejs_compat" ]

# === Durable Objects 配置 ===
# 我们不再需要 script_name，因为 DO 类就在这个项目里
# 构建系统会自动在项目源文件中寻找 "StudyRoom" 这个类
[durable_objects]
bindings = [
  { name = "STUDY_ROOM_DO", class_name = "StudyRoom" }
]
