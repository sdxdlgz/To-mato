# wrangler.toml (Pages 项目的最终正确版本)

name = "to-study"
pages_build_output_dir = "public"

compatibility_date = "2024-05-02"
compatibility_flags = [ "nodejs_compat" ]

# === Durable Objects 配置 ===
[durable_objects]
bindings = [
  # 关键改动在这里：
  # 1. 添加了 script_name，值就是你的项目名 "to-study"
  # 2. 我们将删除下面所有的 [[migrations]] 部分
  { name = "STUDY_ROOM_DO", class_name = "StudyRoom", script_name = "to-study" }
]

# (注意：下面原有的 [[migrations]] 整个部分都已被删除)
